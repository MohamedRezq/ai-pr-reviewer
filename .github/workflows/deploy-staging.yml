# Deploys the `staging` branch to the dedicated Vercel project (ai-pr-reviewer-staging).
# Production project (ai-pr-reviewer) only deploys `master` — see vercel.json.

name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel (staging project)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_2sEN4MTkDy21SIYM7fWe0N5c
          vercel-project-id: prj_cK4CqG8LK1RDQXiWHt0Rax0kEllp
          vercel-args: '--prod'
          working-directory: ./
